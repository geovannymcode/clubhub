name: Go security
on:
  push:
  pull_request:
  schedule:
    - cron: '0 13 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/clubhub ./cmd/http
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
