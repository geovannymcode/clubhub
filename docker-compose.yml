services:
  clubhubdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: clubhub
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clubhub"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      clubhubdb:
        condition: service_healthy
    environment:
      DB_USER: clubhub
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: clubhubdb
      DB_PORT: "5432"
      DB_NAME: clubhub
      # Plaintext is restricted to this private, unpublished Docker network.
      DB_SSLMODE: disable
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      HTTP_ADDR: ":8001"
    networks:
      - database
      - outbound
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    restart: on-failure

networks:
  database:
    internal: true
  outbound:
